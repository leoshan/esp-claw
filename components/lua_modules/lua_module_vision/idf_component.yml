## IDF Component Manager Manifest File
dependencies:
  cap_lua:
    path: ../../claw_capabilities/cap_lua

  lua_module_image:
    path: ../lua_module_image

  # esp-dl and color_detect were gated on LUA_MODULE_VISION_ESPDET /
  # LUA_MODULE_VISION_COLOR_DETECT. Both live in a Kconfig menu that
  # "depends on ESP_BOARD_DEV_CAMERA_SUPPORT", and a disabled symbol is never
  # written to sdkconfig -- so on a board without a camera the manifest rule
  # references a symbol that does not exist. The component manager then asks
  # for a re-run on every solve and CMake gives up with "Missing required
  # kconfig option after retry", making the project unbuildable the moment
  # anything invalidates dependencies.lock.
  #
  # Neither dependency can ever be selected on a cameraless board, so dropping
  # the rules here costs nothing and makes dependency solving converge.
  # Restore both blocks when building a board that declares a camera.
